<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🖼️ Image Gallery</h1>

        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="city">City</button>
            <button class="filter-btn" data-filter="animals">Animals</button>
            <button class="filter-btn" data-filter="technology">Technology</button>
        </div>

        <div class="gallery" id="gallery">
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn">&times;</button>
        <div class="image-counter" id="imageCounter"></div>

        <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
        <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>

        <div class="lightbox-content">
            <img src="" alt="" class="lightbox-image" id="lightboxImage">
        </div>

        <div class="control-panel">
            <button class="control-btn" id="zoomInBtn">🔍 Zoom In</button>
            <button class="control-btn" id="zoomOutBtn">🔍 Zoom Out</button>
            <button class="control-btn" id="resetZoomBtn">↺ Reset</button>
            <button class="control-btn" id="editBtn">✨ Edit</button>
            <button class="control-btn" id="downloadBtn">⬇ Download</button>
        </div>

        <div class="edit-panel" id="editPanel">
            <h3>Image Filters</h3>

            <div class="edit-control">
                <label>Brightness: <span id="brightnessValue">100</span>%</label>
                <input type="range" id="brightness" min="0" max="200" value="100">
            </div>

            <div class="edit-control">
                <label>Contrast: <span id="contrastValue">100</span>%</label>
                <input type="range" id="contrast" min="0" max="200" value="100">
            </div>

            <div class="edit-control">
                <label>Saturation: <span id="saturationValue">100</span>%</label>
                <input type="range" id="saturation" min="0" max="200" value="100">
            </div>

            <div class="edit-control">
                <label>Blur: <span id="blurValue">0</span>px</label>
                <input type="range" id="blur" min="0" max="10" value="0">
            </div>

            <div class="edit-control">
                <label>Grayscale: <span id="grayscaleValue">0</span>%</label>
                <input type="range" id="grayscale" min="0" max="100" value="0">
            </div>

            <div class="edit-control">
                <label>Sepia: <span id="sepiaValue">0</span>%</label>
                <input type="range" id="sepia" min="0" max="100" value="0">
            </div>

            <div class="edit-control">
                <button class="control-btn" id="resetFiltersBtn">Reset Filters</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
