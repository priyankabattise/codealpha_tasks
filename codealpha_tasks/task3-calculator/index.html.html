<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Emojis and Symbols -->
    <div class="bg-element e1">✨</div>
    <div class="bg-element e2">🧮</div>
    <div class="bg-element e3">🌸</div>
    <div class="bg-element e4">⭐</div>
    <div class="bg-element e5">💖</div>
    <div class="bg-element e6">🌈</div>
    <div class="bg-element e7">🎨</div>
    <div class="bg-element e8">🔮</div>

    <div class="app-container">
        <!-- Calculator Section -->
        <div class="calculator">
            <div class="display">
                <div id="previous-operand" class="previous-operand"></div>
                <div id="current-operand" class="current-operand">0</div>
            </div>
            <div class="buttons">
                <button class="clear-btn span-two" onclick="clearDisplay()">AC</button>
                <button class="operator" onclick="deleteNumber()">DEL</button>
                <button class="operator" onclick="chooseOperator('/')">÷</button>
                
                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button class="operator" onclick="chooseOperator('*')">×</button>
                
                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button class="operator" onclick="chooseOperator('-')">-</button>
                
                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>
                <button class="operator" onclick="chooseOperator('+')">+</button>
                
                <button class="span-two" onclick="appendNumber('0')">0</button>
                <button onclick="appendNumber('.')">.</button>
                <button class="equals" onclick="compute()">=</button>
            </div>
        </div>

        <!-- History Panel Section -->
        <div class="history-panel">
            <h2>History</h2>
            <ul id="history-list" class="history-list">
            
            </ul>
            <button class="clear-history-btn" onclick="clearHistory()">Clear History</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
